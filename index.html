<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tarjetas de Reflexión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="slider" class="cards-slider">
        <section class="card card-green active" id="card-0">
            <div class="glass-card flex flex-col items-center">
                <div class="text-6xl mb-6">💚</div>
                <h2 class="text-2xl font-bold uppercase tracking-wider mb-3 opacity-90">Verde</h2>
                <p class="text-xl md:text-2xl font-semibold leading-relaxed">Esto me ayuda a acercarme a Dios</p>
            </div>
        </section>
        <section class="card card-yellow" id="card-1">
            <div class="glass-card flex flex-col items-center">
                <div class="text-6xl mb-6">💛</div>
                <h2 class="text-2xl font-bold uppercase tracking-wider mb-3 opacity-90">Amarillo</h2>
                <p class="text-xl md:text-2xl font-semibold leading-relaxed">Algo que me está distrayendo</p>
            </div>
        </section>
        <section class="card card-red" id="card-2">
            <div class="glass-card flex flex-col items-center">
                <div class="text-6xl mb-6">❤️</div>
                <h2 class="text-2xl font-bold uppercase tracking-wider mb-3 opacity-90">Rojo</h2>
                <p class="text-xl md:text-2xl font-semibold leading-relaxed">Esto necesito cambiar</p>
            </div>
        </section>
    </div>

    <nav class="nav-bar">
        <button onclick="goToCard(0)" id="btn-0" class="nav-btn active-green"><span>💚</span></button>
        <button onclick="goToCard(1)" id="btn-1" class="nav-btn"><span>💛</span></button>
        <button onclick="goToCard(2)" id="btn-2" class="nav-btn"><span>❤️</span></button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
